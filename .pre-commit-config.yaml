repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: ^(mkdocs\.yml|{{cookiecutter.repo_name}}/mkdocs\.yml)$
      - id: check-case-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=100000] # 100MB

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.3
    hooks:
      # No explicit --config here on purpose: pre-commit runs hooks from the
      # repo root, so plain `ruff check`/`ruff format` auto-discover the root
      # ruff.toml pointer the same way a bare `uv run ruff check .` does (see
      # that file's own comment). Passing --config .code_quality/ruff.toml
      # directly here would skip that root file and resolve this file's
      # relative per-file-ignores globs against the wrong base directory.
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        args:
          - --config-file=.code_quality/mypy.ini

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.1
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages: [pre-push]
