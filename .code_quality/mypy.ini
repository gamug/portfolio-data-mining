[mypy]
show_error_codes = True
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_untyped_calls = True
check_untyped_defs = True
ignore_missing_imports = True
# apps/*.py and cli/*.py bootstrap `src/` onto sys.path at runtime (see
# CLAUDE.md's "apps/ vs cli/" section) -- mypy has no equivalent of that, so
# without this it can't find news_collector/news_nlp/pricing/etc. from those
# entrypoints and silently treats every import from them as Any, which then
# masks real type errors and misattributes others. Mirrors pytest.ini's
# `pythonpath = src .` for the same reason.
mypy_path = src
