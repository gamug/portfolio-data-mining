# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "old",
    "env",
    ".env",
    ".venv",
    "migrations",
]

#same as black
line-length = 100
indent-width = 4

# Assume Python 3.11
target-version = "py311"

# Include ipython notebooks
extend-include = ["*.ipynb"]

[lint]
select = [
    # flake8-bugbear
    "B",
    # mccabe
    "C90",
    # pycodestyle
    "E",
    # pyflakes
    "F",
    # warnings
    "W",
    # pylint
    "PL",
    # isort
    "I",
    # flake8-bandit
    "S",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # flake8-simplify
    "SIM",
    # tryceratops
    "TRY",
    ]
ignore = [
    "E203",  # Like Black, ignore E203 (whitespace before ':') to avoid conflicts.
    "S101", # bandit: Use of `assert` detected
    "E501", # Like Black, ignore E501 (line too long) to avoid conflicts.
    "TRY003", # tryceratops: Avoid long error messages
    ]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
# Enable auto-formatting of code examples in docstrings.
docstring-code-format = true

[lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[lint.pylint]
# Default max-args (5) is too strict for this codebase's routine patterns:
# FastAPI query-param endpoints (each filter is its own Query(...) parameter
# so it shows up in the OpenAPI schema), SQLite row-shaped read/write
# functions (one arg per column), and test fixtures/helpers that take one
# kwarg per seeded field. 15 comfortably covers the widest current offender
# (a 14-kwarg test fixture) while still catching genuinely runaway signatures.
max-args = 15

[lint.isort]
known-third-party = ["fastapi", "pydantic"]

[lint.per-file-ignores]
# B008: FastAPI's dependency-injection idiom is exactly `= Depends(...)` /
# `= Query(...)` in a parameter default -- that's the framework calling
# convention, not the mutable-default-argument bug B008 exists to catch.
# Patterns are relative to this file's own directory (.code_quality/), which
# is how Ruff resolves per-file-ignores globs from a config reached via
# another file's `extend`, not relative to the repo root -- hence `../`.
"../apps/*_api.py" = ["B008"]
"../apps/gateway.py" = ["B008"]
"../src/*/api/**/*.py" = ["B008"]

# E402: every apps/*.py and cli/*.py entrypoint does
# `sys.path.insert(0, str(Path(__file__)... / "src"))` before its first
# local import so it can run standalone with no PYTHONPATH setup (see
# CLAUDE.md's "apps/ vs cli/" section) -- imports genuinely can't move above
# that line without breaking the bootstrap.
"../apps/*.py" = ["E402"]
"../cli/*.py" = ["E402"]

# PLR2004: in tests, literal expected values (HTTP status codes, row counts,
# scores) *are* the spec being asserted -- naming each one as a constant
# would just move the magic number one line up, not remove it.
"../tests/**/*.py" = ["PLR2004"]
