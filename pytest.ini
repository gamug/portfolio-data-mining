[pytest]
; "src" so every module's package (news_collector, extractor, news_nlp,
; common, pricing, sec_edgar) is importable the same way its own app.py
; imports it; "." so `apps.*` (e.g. tests/news_nlp/conftest.py importing
; `apps.news_nlp_api`) resolves from the repo root too.
pythonpath = src .
testpaths = tests
asyncio_mode = auto
