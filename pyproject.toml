[project]
name = "portfolio-data-mining"
version = "0.1.0"
description = "Financial-news + SEC-filings data-mining pipeline (news_collector -> extractor, plus independent pricing and sec_edgar services)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- shared library (SQLite connect/schema, S&P 500 universe) ----------
    "portfolio-common",
    # --- shared web/runtime -----------------------------------------------
    "httpx[http2]>=0.27.0",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "python-dotenv>=1.0.0",
    "pandas>=2.0",
    "numpy",
    "tqdm>=4.66",
    "requests",
    # --- news_collector (src/news_collector - discovery stage) --------------
    "ddgs>=9.0.0",
    "yfinance>=0.2.40",
    "tenacity>=8.3.0",
    "feedparser>=6.0.11",
    "lxml>=5.2.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.1",
    # --- extractor (src/extractor - news-crawler, full-text extraction) -----
    "beautifulsoup4>=4.12",
    "trafilatura>=1.12",
    "langdetect>=1.0.9",
    # --- pricing (src/pricing - Finnhub pricing/news/market data) -----------
    "finnhub-python==2.4.29",
    # --- sec_edgar (src/sec_edgar - SEC EDGAR filings) -----------------------
    "edgartools==5.44.1",
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "respx>=0.21",
    "pre-commit>=4.0",
    "ruff==0.16.3",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.uv.sources]
# The shared library lives in its own repo (github.com/gamug/portfolio-common)
# and is normally pinned by tag -- bump the tag here to adopt a new schema/
# universe contract. For local work against a checkout next to this repo,
# override with an editable path source:
#   portfolio-common = { path = "../portfolio-common", editable = true }
#
# Pinned by commit rather than tag right now: v1.0.0 is a clean-break rewrite
# (portfolio_common.db.Database + in_clause/Allowlist only -- .schema/
# .portfolio/.universe_history/.errors moved into this repo's own
# src/data_mining/, see docs/portfolio-common-v1-migration-plan.md) that
# master already contains, but the v1.0.0 tag itself hasn't been cut in that
# repo yet. Swap this to `tag = "v1.0.0"` once it is (same commit).
portfolio-common = { git = "https://github.com/gamug/portfolio-common", rev = "aa59a7ec02610b19b6c21a2441ec422bc5a12e57" }
