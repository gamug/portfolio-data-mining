[project]
name = "portfolio-data-mining"
version = "0.1.0"
description = "Financial-news + SEC-filings data-mining pipeline (news_collector -> extractor -> news_nlp, plus independent pricing and sec_edgar services)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # --- shared web/runtime -------------------------------------------------
    "httpx[http2]>=0.27.0",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "python-dotenv>=1.0.0",
    "pandas>=2.0",
    "numpy",
    "tqdm>=4.66",
    "requests",
    # --- news_collector (src/news_collector - discovery stage) --------------
    "ddgs>=9.0.0",
    "yfinance>=0.2.40",
    "tenacity>=8.3.0",
    "aiosqlite>=0.20.0",
    "feedparser>=6.0.11",
    "lxml>=5.2.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.1",
    # --- extractor (src/extractor - news-crawler, full-text extraction) -----
    "beautifulsoup4>=4.12",
    "trafilatura>=1.12",
    "langdetect>=1.0.9",
    # --- news_nlp (src/news_nlp - sentiment + NER) ---------------------------
    # torch is pinned to what the cu124 wheel index (see [tool.uv.sources]
    # below) actually publishes - that index stops at 2.6.0, so an
    # unbounded/newer requirement here would make uv fall back to a plain
    # PyPI build (a different, unpinned CUDA version) instead of erroring.
    "torch>=2.4,<2.7",
    "transformers>=4.40",
    "datasets>=2.19",
    "accelerate>=0.30",
    "evaluate>=0.4",
    "seqeval>=1.2",
    "huggingface_hub>=0.24",
    # --- pricing (src/pricing - Finnhub pricing/news/market data) -----------
    "finnhub-python==2.4.29",
    # --- sec_edgar (src/sec_edgar - SEC EDGAR filings) -----------------------
    "edgartools==5.44.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "respx>=0.21",
    "pre-commit>=4.0",
    "ruff==0.16.3",
    "mypy>=1.13",
]

[tool.uv]
package = false

# torch isn't listed directly under [project] dependencies - it comes in
# transitively (accelerate requires it) - but `uv sync` still needs to know
# which wheel to fetch. This pins it to the same cu124 build the old
# `pip install torch --index-url https://download.pytorch.org/whl/cu124`
# manual step used, so `uv sync`/`uv lock` alone reproduce it exactly.
[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
