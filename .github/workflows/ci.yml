name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint / type-check / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Reads .python-version (3.12).
      - name: Set up Python
        run: uv python install

      # --locked fails if uv.lock is out of date with pyproject.toml, rather
      # than silently re-resolving.
      - name: Install the project (locked)
        run: uv sync --locked --group dev

      # Same order as the constitution's "Executable cmds" — don't reorder.
      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy --config-file=.code_quality/mypy.ini src apps cli

      - name: Tests
        run: uv run pytest -q
